<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 对话</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 左侧：会话列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <div class="brand">
          <span class="brand__dot"></span>
          <span class="brand__name">AI 对话</span>
        </div>
        <button class="btn btn--primary btn--block" id="btn-new">新建对话</button>
      </div>

      <nav class="conv-list" id="conv-list"></nav>

      <div class="sidebar__foot">
        <span class="status" id="status">
          <i class="status__dot" data-state="pending"></i>
          <span class="status__text" id="status-text">连接中…</span>
        </span>
        <button class="settings-toggle" id="btn-settings" title="模型设置" aria-label="模型设置">
          <svg class="icon-gear" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="settings-toggle__label">设置</span>
        </button>
      </div>
    </aside>

    <!-- 右侧：对话区 -->
    <main class="chat">
      <header class="chat__head">
        <button class="btn btn--icon chat__menu" id="btn-menu" aria-label="会话列表">≡</button>
        <h1 class="chat__title" id="chat-title">新对话</h1>
        <div class="chat__actions">
          <label class="switch">
            <input type="checkbox" id="toggle-stream" checked>
            <span>流式输出</span>
          </label>
          <button class="btn btn--ghost" id="btn-clear">清空</button>
        </div>
      </header>

      <div class="messages" id="message-list"></div>

      <footer class="composer">
        <div class="composer__box">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
          <div class="composer__ops">
            <span class="composer__hint" id="counter">0 / 4000</span>
            <button class="btn btn--primary" id="btn-send">发送</button>
            <button class="btn btn--danger" id="btn-stop" hidden>停止</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- 左下角设置面板：tab 切换「对话模型 / 向量模型」 -->
  <div class="settings-panel" id="settings-panel" hidden>
    <div class="settings-panel__head">
      <span>模型设置</span>
      <button class="settings-panel__close" id="btn-settings-close" aria-label="关闭">×</button>
    </div>
    <div class="settings-panel__tabs" role="tablist">
      <button class="settings-tab is-active" data-tab="llm" role="tab" aria-selected="true">对话模型</button>
      <button class="settings-tab" data-tab="mem" role="tab" aria-selected="false">向量模型</button>
    </div>
    <div class="settings-panel__body">
      <!-- 对话模型 tab -->
      <div class="settings-pane" id="pane-llm" role="tabpanel">
        <label class="field">
          <span class="field__label">模型类型</span>
          <select id="cfg-provider">
            <option value="echo">Echo（离线回声，无需 Key）</option>
            <option value="openai">OpenAI 兼容</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">API Base URL</span>
          <input id="cfg-base-url" type="text" placeholder="https://api.openai.com/v1" autocomplete="off">
        </label>
        <label class="field">
          <span class="field__label">API Key</span>
          <div class="field__key">
            <input id="cfg-api-key" type="password" placeholder="留空则不修改" autocomplete="off">
            <button type="button" class="link-btn" id="btn-clear-key">清除</button>
          </div>
          <span class="field__hint" id="cfg-key-hint"></span>
        </label>
        <label class="field">
          <span class="field__label">模型名称</span>
          <input id="cfg-model" type="text" placeholder="gpt-4o-mini" autocomplete="off">
        </label>
        <label class="field">
          <span class="field__label">
            温度 <span class="field__val" id="cfg-temp-val">0.7</span>
          </span>
          <input id="cfg-temp" type="range" min="0" max="2" step="0.1" value="0.7">
        </label>
        <div class="field--switch">
          <label class="switch">
            <input type="checkbox" id="cfg-strict">
            <span class="field__label">严格按知识库回答</span>
          </label>
          <span class="field__hint">开启后仅依据《通用IT知识》回答，资料缺失时直接拒答（不调用模型通用知识）。关闭则为「优先」模式。</span>
        </div>
      </div>

      <!-- 向量模型 tab -->
      <div class="settings-pane" id="pane-mem" role="tabpanel" hidden>
        <label class="field">
          <span class="field__label">向量来源</span>
          <select id="cfg-mem-provider">
            <option value="local">本地模型（bge，默认）</option>
            <option value="openai">远程接口（OpenAI 兼容）</option>
            <option value="lexical">离线词法（无需模型）</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">向量 API Base URL</span>
          <input id="cfg-mem-base-url" type="text" placeholder="https://api.openai.com/v1" autocomplete="off">
        </label>
        <label class="field">
          <span class="field__label">向量 API Key</span>
          <div class="field__key">
            <input id="cfg-mem-api-key" type="password" placeholder="留空则不修改" autocomplete="off">
            <button type="button" class="link-btn" id="btn-clear-mem-key">清除</button>
          </div>
          <span class="field__hint" id="cfg-mem-key-hint"></span>
        </label>
        <label class="field">
          <span class="field__label">向量模型名称</span>
          <input id="cfg-mem-model" type="text" placeholder="text-embedding-v3 / bge-m3" autocomplete="off">
        </label>
        <span class="field__hint">本地模型不可用且已配置远程接口（API Key 非空）时，记忆召回自动改用远程向量模型兜底。</span>
      </div>

      <div class="settings-panel__msg" id="settings-msg"></div>
    </div>
    <div class="settings-panel__foot">
      <button class="btn btn--ghost" id="btn-settings-cancel">取消</button>
      <button class="btn btn--primary" id="btn-settings-save">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
